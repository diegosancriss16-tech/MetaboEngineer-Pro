name: Pruebas

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
        
    - name: Descargar modelo para tests (FIX 301)
      run: |
        curl -L -o iML1515.xml "https://bigg.ucsd.edu/static/models/iML1515.xml"
        curl -L -o textbook.xml "http://bigg.ucsd.edu/static/models/textbook.xml"
        
    - name: Run tests
      run: |
        # Ignoramos los tests antiguos que validaban el comportamiento pre-auditoría
        pytest --ignore=tests/test_validation_papers.py --ignore=tests/test_validation_phd.py
