[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metaboengineer"
version = "0.1.0b1"
description = "Suite integrada de ingeniería metabólica para diseño racional de cepas (FBA + GA + OptKnock + termodinámica)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "PolyForm Noncommercial License 1.0.0"}
authors = [{name = "Diego Sancristóbal"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "cobra>=0.29.0",
    "swiglpk>=5.0.10",
    "optlang>=1.8.1",
    "equilibrator-api>=0.4.1",
    "equilibrator-cache>=0.4.1",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "networkx>=3.0",
    "pyvis>=0.3.2",
    "requests>=2.28.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
web       = ["streamlit>=1.30.0"]
benchmark = ["straindesign>=1.15", "cameo"]
dev       = ["pytest>=7.4.0", "pytest-cov>=4.1.0"]

[tool.setuptools]
# No usamos src/ layout: tus archivos están en la raíz, así que los declaramos explícitos
py-modules = [
    "metabo_engineer",
    "cli_experto",
    "modulo_termodinamica_v2",
    "diagnostico",
    "reporte_investigador",
    "visualizador_universal",
]

[tool.pytest.ini_options]
testpaths = ["tests"]